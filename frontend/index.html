<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FestPass 2026</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1a1f2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --ok: #16a34a;
      --ok-bg: #dcfce7;
      --bad: #dc2626;
      --bad-bg: #fee2e2;
      --wait: #d97706;
      --wait-bg: #fef3c7;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1420;
        --card: #171d2b;
        --text: #e6e9f2;
        --muted: #9aa3b5;
        --border: #262e40;
        --accent: #818cf8;
        --accent-hover: #6366f1;
        --ok: #4ade80;
        --ok-bg: #123524;
        --bad: #f87171;
        --bad-bg: #3a1717;
        --wait: #fbbf24;
        --wait-bg: #3a2e10;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 1rem 3rem;
      display: grid;
      gap: 1.25rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.25rem 0 0;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .card h2 {
      margin: 0 0 0.9rem;
      font-size: 1rem;
    }
    #status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.9rem;
      background: var(--wait-bg);
      color: var(--wait);
      word-break: break-word;
    }
    #status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex: none;
    }
    #status.ok { background: var(--ok-bg); color: var(--ok); }
    #status.bad { background: var(--bad-bg); color: var(--bad); }
    form {
      display: grid;
      grid-template-columns: 1fr 170px auto;
      gap: 0.6rem;
    }
    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      background: var(--bg);
      color: var(--text);
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      padding-inline: 1.2rem;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: wait; }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }
    #list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .badge {
      min-width: 2.5rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
    }
    .who { font-weight: 600; }
    .event {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .empty {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr; }
      #list li { flex-wrap: wrap; }
      .event { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>FestPass 2026</h1>
      <p>Tech fest registrations</p>
    </header>

    <section class="card">
      <p id="status">Checking the backend…</p>
    </section>

    <section class="card">
      <h2>Register</h2>
      <form id="form">
        <input id="name" placeholder="Your name" required autocomplete="off">
        <select id="event">
          <option>Hackathon</option>
          <option>Robo Race</option>
          <option>Tech Quiz</option>
        </select>
        <button type="submit" id="submit">Register</button>
      </form>
    </section>

    <section class="card">
      <h2>Registrations</h2>
      <ul id="list"></ul>
      <p class="empty" id="empty" hidden>No registrations yet. Be the first!</p>
    </section>
  </main>

  <script>
    const api = (path, options) => fetch("/api/" + path, options).then(r => r.json());

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const form = document.getElementById("form");
    const nameEl = document.getElementById("name");
    const eventEl = document.getElementById("event");
    const submitEl = document.getElementById("submit");

    function setStatus(text, state) {
      statusEl.textContent = text;
      statusEl.className = state;
    }

    async function refresh() {
      try {
        const h = await api("health");
        setStatus(`REGNO ${h.regno} | backend ${h.version} on ${h.container} | database ${h.database ? "connected" : "not connected"}`,
                  h.database ? "ok" : "bad");
        const rows = await api("registrations");
        const items = Array.isArray(rows) ? rows : [];
        listEl.replaceChildren(...items.map(r => {
          const li = document.createElement("li");
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = `#${r.id}`;
          const who = document.createElement("span");
          who.className = "who";
          who.textContent = r.name;
          const ev = document.createElement("span");
          ev.className = "event";
          ev.textContent = r.event;
          li.append(badge, who, ev);
          return li;
        }));
        emptyEl.hidden = items.length > 0;
      } catch (err) {
        setStatus("Backend not reachable", "bad");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitEl.disabled = true;
      try {
        await api("registrations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameEl.value, event: eventEl.value }),
        });
        nameEl.value = "";
        await refresh();
      } finally {
        submitEl.disabled = false;
      }
    });

    refresh();
  </script>
</body>
</html>
